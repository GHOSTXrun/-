</style></head><body><script>// Local paper execution only. No wallet, RPC, exchange or signing integration.
const defaults = Object.freeze({initial:33.40, allocation:10, slippage:1.5, lossLimit:10});
const roles = [
  ['Scout','DISCOVERY','Tracks new pairs and volume acceleration. Produces candidates; never submits orders.'],

  ['Sizer','POSITION RISK','Sizes every position from current equity, available cash and the session exposure limit.'],
  ['Trigger','EXECUTION','Opens and closes approved paper positions. Rejects quotes above the 1.5% slippage ceiling.'],
  ['Scribe','DECISION AUDIT','Records the signal, safety verdict, sizing rationale and execution outcome under one trace ID.'],
  ['Ledger','RECONCILIATION','Reconciles cash, fees and realized P&L after every close. Never counts an open position as settled profit.']
];
function settings(input={}) {
  const c={...defaults,...input};
  for(const key of Object.keys(defaults)) if(typeof c[key]!=='number'||!Number.isFinite(c[key])) throw Error('Invalid '+key);
  if(c.initial<1||c.initial>1000000||c.allocation<1||c.allocation>25||c.slippage<0.1||c.slippage>1.5||c.lossLimit<1||c.lossLimit>25) throw Error('Settings outside permitted range');
  return c;
}
function createSession(config=defaults){ const c=settings(config);return {version:1,config:c,balance:c.initial,trades:[],logs:[],filtered:0,cursor:0,halted:false}; }
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
function validateCandidate(q,c=defaults){
  if(!q||!Number.isFinite(q.entry)||!Number.isFinite(q.exit)||q.entry<=0||q.exit<=0)return 'invalid price';
  if(!Number.isFinite(q.age)||q.age<0||q.age>30)return 'stale quote';
  if(q.sellable!==true)return 'sell simulation failed';
  if(q.controlsRevoked!==true)return 'token controls unverified';
  if(!Number.isFinite(q.liquidity)||q.liquidity<25000)return 'liquidity below $25,000';
  if(!Number.isFinite(q.slippage)||q.slippage<0||q.slippage>c.slippage)return 'slippage cap exceeded';
  return null;
}
function fixture(i){
  const entry=1+(i%7)*.23;
  return {symbol:['NOVA','WING','DUSK','MOSS','ECHO','FERN'][i%6]+'/USDC',entry,exit:entry*(1+[.035,-.025,.018,.05,-.04,.012][i%6]),age:i%11===7?45:2,sellable:i%9!==4,controlsRevoked:i%13!==8,liquidity:i%8===3?12000:85000,slippage:i%10===6?1.8:.35};
}
function step(session,quote=fixture(session.cursor),at=new Date().toISOString()){
  if(session.halted)return session;
  const s=structuredClone(session),trace='NJ-'+String(++s.cursor).padStart(5,'0');
  const log=(agent,decision,reason)=>s.logs.unshift({trace,at,agent,decision,reason,mode:'PAPER / SYNTHETIC'});
  log('Scout','CANDIDATE',quote.symbol+' · synthetic volume signal');
  const rejection=validateCandidate(quote,s.config);
  if(rejection){s.filtered++;log('Guard','REJECT',rejection);log('Scribe','RECORDED','No order created; safety gate closed.');return s;}
  log('Guard','PASS','Synthetic safety fixture passed; not an on-chain token audit.');
  const size=round(s.balance*s.config.allocation/100);
  if(size<=0||size>s.balance){log('Sizer','REJECT','Insufficient available paper cash');return s;}
  log('Sizer','SIZED','$'+size.toFixed(2)+' · '+s.config.allocation+'% of available equity');
  // Two-sided adverse slippage plus a 0.1% fee on each side.
  const buy=quote.entry*(1+quote.slippage/100),sell=quote.exit*(1-quote.slippage/100);
  const units=size/(buy*1.001),proceeds=units*sell*.999,pnl=round(proceeds-size);
  s.balance=round(s.balance+pnl);
  s.trades.unshift({trace,at,symbol:quote.symbol,size,pnl,balance:s.balance,entry:buy,exit:sell,slippage:quote.slippage,fees:round(size-size/1.001+units*sell*.001),mode:'PAPER',reason:'Synthetic momentum fixture; safety gate passed; size capped by current equity.'});
  log('Trigger','CLOSED','Paper round trip · slippage '+quote.slippage+'% per side; fees 0.1% per side');
  log('Scribe','RECORDED','Signal → guard → sizing → execution recorded under '+trace);
  log('Ledger','SETTLED','Net '+(pnl>=0?'+':'')+pnl.toFixed(2)+' · balance $'+s.balance.toFixed(2));
  if(s.balance<=s.config.initial*(1-s.config.lossLimit/100)){s.halted=true;log('Guard','HALTED','Session loss limit reached; start a new session to resume.');}
  return s;
}
// A visible paper order stays open for one replay tick, then reconciles on the next.
function advance(session,at=new Date().toISOString()){
  if(session.halted)return session;
  if(session.position&&session.pendingClose){
    const result=structuredClone(session.pendingClose),trace=session.position.trace;
    result.trades[0].at=at;
    for(const log of result.logs)if(log.trace===trace&&['CLOSED','SETTLED','HALTED'].includes(log.decision))log.at=at;
    const open=session.logs.find(log=>log.trace===trace&&log.decision==='OPEN');
    const index=result.logs.findIndex(log=>log.trace===trace&&log.agent==='Sizer');
    if(open)result.logs.splice(index,0,open);
    return result;
  }
  const completed=step(session,fixture(session.cursor),at);
  if(completed.trades.length===session.trades.length)return completed;
  const trade=completed.trades[0],interim=structuredClone(session);
  interim.cursor=completed.cursor;
  interim.position={...trade,at,status:'OPEN'};
  interim.pendingClose=completed;
  interim.logs=completed.logs.filter(log=>log.trace!==trade.trace||['Scout','Guard','Sizer'].includes(log.agent));
  interim.logs.unshift({trace:trade.trace,at,agent:'Trigger',decision:'OPEN',reason:'Paper entry '+trade.symbol+' · '+trade.size.toFixed(2)+' USD · quote within slippage cap',mode:'PAPER / SYNTHETIC'});
  return interim;
}

 const latest=session.logs[0];$('[data-nd-latest]').textContent=latest?latest.agent.toUpperCase()+' · '+latest.decision+' · '+latest.trace:'NO REASON, NO TRADE';
const captions={Scout:['new pairs + volume spikes','points, never pulls the trigger'],Guard:['rug + honeypot screen','no pass, no position'],Sizer:['sizes from live equity','size follows equity, not mood'],Trigger:['opens + closes, caps slip','slip cap '+session.config.slippage+'%'],Scribe:['writes every decision','every line has a why'],Ledger:['balance + curve','marks the result on every close']};
 $('[data-nd-agents]').innerHTML=roles.map(([name,role,description],i)=>{const last=session.logs.find(l=>l.agent===name);return '<button class="nd-agent '+(latest?.agent===name?'nd-focus':'')+'" data-nd-agent="'+name+'"><span class="nd-agent-icon">'+icon(name)+'</span><span class="nd-agent-content"><span class="nd-agent-name"><b>'+name.toUpperCase()+'</b><em>'+(last?esc(last.decision):'READY')+'</em></span><small>'+esc(captions[name][0])+'</small><p>'+esc(captions[name][1])+'</p><code>'+esc(last?last.reason:'Awaiting first paper decision.')+'</code></span></button>';}).join('');
 $('[data-nd-candidates]').innerHTML=Array.from({length:4},(_,i)=>{const q=fixture(session.cursor+i),reason=validateCandidate(q,session.config);return '<article class="'+(reason?'nd-rejected':'')+'"><div><b>'+esc(q.symbol)+'</b><i></i></div><small>'+esc(reason||'candidate · synthetic fixture')+'</small></article>';}).join('');
 const chronological=[...session.trades].reverse(),equity=[session.config.initial,...chronological.map(t=>t.balance)];
 $('[data-nd-chart]').innerHTML=curve(equity);
 $('[data-nd-signal]').innerHTML=curve(equity.slice(-18),70);
 $('[data-nd-record]').textContent=wins+' W / '+losses+' L · '+session.filtered+' FILTERED';
 const trade=session.position||session.trades[0];
 const isOpen=!!session.position;
 root.querySelectorAll('.nd-stages [data-nd-agent]').forEach(el=>el.classList.toggle('nd-focus',el.dataset.ndAgent===latest?.agent));
 $('[data-nd-trade]').innerHTML=trade?'<div class="nd-trade-name"><strong>'+esc(trade.symbol)+'</strong><b class="'+(trade.pnl<0?'nd-negative':'')+'">'+(isOpen?'OPEN':money(trade.pnl))+'</b></div><dl>'+[['entry',trade.entry.toFixed(6)],['exit',isOpen?'open':trade.exit.toFixed(6)],['slippage',trade.slippage+'% per side'],['size',money(trade.size)]].map(([k,v])=>'<dt>'+k+'</dt><dd>'+v+'</dd>').join('')+'</dl><p class="nd-why"><b>WHY / </b>'+esc(isOpen?'Paper entry approved · awaiting next replay tick to close.':trade.reason)+'</p><button class="nd-trace" data-trace="'+esc(trade.trace)+'">INSPECT '+esc(trade.trace)+' ↗</button>':'<div class="nd-empty">Scout is watching.<br><span>Start paper mode to generate a complete decision trace.</span></div>';
 $('[data-nd-tail]').innerHTML=session.logs.slice(0,5).reverse().map(l=>'<button data-trace="'+esc(l.trace)+'"><span>'+when(l.at)+' <b>'+esc(l.agent)+'</b><em class="'+(l.decision==='REJECT'?'nd-negative':'')+'">'+esc(l.decision)+'</em></span><small>'+esc(l.reason)+'</small></button>').join('')||'<div class="nd-empty">$ tail -f night.log<br><span>waiting for the first decision<span class="nd-cursor">_</span></span></div>';
 $('[data-nd-audit]').innerHTML=session.logs.slice(0,5).map(l=>'<button data-trace="'+esc(l.trace)+'"><time>'+when(l.at)+'</time><b class="'+(l.decision==='REJECT'?'nd-negative':'')+'">'+esc(l.decision)+'</b><span><strong>'+esc(l.agent)+' / '+esc(l.trace)+'</strong><small>'+esc(l.reason)+'</small></span><em>↗</em></button>').join('')||'<div class="nd-empty">No decisions yet. Every signal will be logged here.</div>';
}


mountDesk();
const send=(command,value)=>parent.postMessage({type:"nightjar:panel-command",command,value},"*");
addEventListener("message",event=>{if(event.source!==parent||event.data?.type!=="nightjar:session")return;renderDesk(event.data.session,event.data.running);document.querySelectorAll("[data-action=toggle]").forEach(b=>b.textContent=event.data.running?"PAUSE PAPER SESSION":"START PAPER SESSION");if(event.data.speed)document.querySelector("#nd-speed").value=String(event.data.speed);requestAnimationFrame(reportSize);});
document.addEventListener("click",event=>{const agent=event.target.closest("[data-nd-agent]"),trace=event.target.closest("[data-trace]"),action=event.target.closest("[data-action]"),link=event.target.closest("a");if(agent){send("agent",agent.dataset.ndAgent);return;}if(trace){send("trace",trace.dataset.trace);return;}if(action){send(action.dataset.action==="export"?"json":action.dataset.action);return;}if(link){event.preventDefault();send("jump",link.hash==="#spawn"?"risk":link.hash.slice(1));}});
document.addEventListener("change",event=>{if(event.target.id==="nd-speed")send("speed",Number(event.target.value));});
function reportSize(){parent.postMessage({type:"nightjar:panel-size",height:Math.ceil(document.querySelector("#desk").getBoundingClientRect().height+24)},"*");}
new ResizeObserver(reportSize).observe(document.querySelector("#desk"));
setInterval(()=>{const el=document.querySelector("[data-nd-clock]");if(el)el.textContent=new Date().toLocaleTimeString("en-GB",{hour12:false});},1000);
parent.postMessage({type:"nightjar:panel-ready"},"*");</script></body></html>
